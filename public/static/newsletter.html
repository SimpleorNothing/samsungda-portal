<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스레터 모음 · 기획도구 모음</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --paper:#EDEFEC;--panel:#ffffff;--ink:#17222D;--muted:#5C6B79;
    --line:#D3D9D6;--line-strong:#9AA6A0;--new:#46647E;--purple:#6B4E9B;--insight:#B02E24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;padding:56px 24px}
  .wrap{max-width:680px;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:18px}
  .back:hover{color:var(--ink)}
  header{margin-bottom:18px;border-bottom:2px solid var(--ink);padding-bottom:14px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:15px;line-height:1.55}
  .section{background:var(--panel);border:1px solid var(--line-strong);border-top:3px solid var(--accent,var(--line-strong));padding:22px 20px;margin-top:22px}
  .section.dir{--accent:var(--purple)}
  .section.sub-sec{--accent:var(--new)}
  .sec-head{display:flex;align-items:baseline;gap:9px;margin-bottom:14px}
  .sec-head h2{font-size:18px;font-weight:700;letter-spacing:-.2px}
  .sec-head .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .preview-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--new);text-decoration:none;border:1px solid var(--line-strong);padding:7px 12px;margin-bottom:14px;transition:border-color .15s,color .15s}
  .preview-link:hover{border-color:var(--new);color:var(--ink)}
  .issue-list{list-style:none;display:flex;flex-direction:column}
  .issue-list li{border-top:1px solid var(--line)}
  .issue-list li:first-child{border-top:none}
  .issue-list a{display:flex;align-items:center;gap:8px;padding:11px 2px;font-size:14px;color:var(--ink);text-decoration:none;transition:color .12s}
  .issue-list a:hover{color:var(--new)}
  .issue-list a .d{font-variant-numeric:tabular-nums;font-weight:600}
  .issue-list a .arw{margin-left:auto;color:var(--line-strong);font-size:13px}
  .issue-list a:hover .arw{color:var(--new)}
  .state{font-size:14px;color:var(--muted);line-height:1.65;padding:6px 0}
  .sub-note{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
  .sub-form{display:flex;gap:8px;flex-wrap:wrap}
  .sub-form input[type=email]{flex:1;min-width:200px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);padding:11px 12px}
  .sub-form input[type=email]:focus{outline:none;border-color:var(--new)}
  .sub-form button{font-family:inherit;font-size:14px;font-weight:600;color:#fff;background:var(--ink);border:1px solid var(--ink);padding:11px 20px;cursor:pointer;transition:opacity .15s;white-space:nowrap}
  .sub-form button:hover{opacity:.9}
  .sub-form button:disabled{opacity:.5;cursor:default}
  .sub-msg{margin-top:12px;font-size:13.5px;line-height:1.6;min-height:1.2em}
  .sub-msg.ok{color:var(--new);font-weight:600}
  .sub-msg.err{color:var(--insight);font-weight:600}
  @media (max-width:520px){body{padding:40px 18px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 기획도구 모음</a>
  <header>
    <h1>뉴스레터 모음</h1>
    <p class="sub">기획 데일리 — 지표·뉴스에 의미를 더한 인사이트 브리핑. 발행분을 모아 보고, 메일 구독을 신청할 수 있습니다.</p>
  </header>

  <section class="section dir">
    <div class="sec-head"><h2>발행 뉴스레터</h2><span class="cnt" id="issueCnt"></span></div>
    <a class="preview-link" href="https://samsungda-newsletter.cw120-park.workers.dev/preview" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></g></svg>
      이번 호 미리보기
    </a>
    <ul class="issue-list" id="issueList"></ul>
    <div class="state" id="issueState">발행 내역을 불러오는 중…</div>
  </section>

  <section class="section sub-sec">
    <div class="sec-head"><h2>구독 신청</h2></div>
    <p class="sub-note">신청하시면 발행이 시작될 때 입력한 메일로 기획 데일리를 받아보실 수 있습니다. 사내 메일 주소로 신청해 주세요.</p>
    <div class="sub-form">
      <input type="email" id="subEmail" placeholder="name@samsung.com" autocomplete="email" aria-label="구독 이메일">
      <button type="button" id="subBtn">구독 신청</button>
    </div>
    <div class="sub-msg" id="subMsg" role="status" aria-live="polite"></div>
  </section>
</div>
<script>
(function(){
  var NL_BASE = "https://samsungda-newsletter.cw120-park.workers.dev";

  // ── 발행 아카이브 목록 ──
  var listEl = document.getElementById("issueList");
  var stateEl = document.getElementById("issueState");
  var cntEl = document.getElementById("issueCnt");
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  fetch("/api/newsletter/list", { headers:{ "accept":"application/json" } })
    .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
    .then(function(data){
      var issues = (data && data.issues) || [];
      if(!issues.length){
        stateEl.textContent = "아직 발행된 뉴스레터가 없습니다. 첫 호가 발행되면 여기에 모입니다.";
        return;
      }
      stateEl.style.display = "none";
      cntEl.textContent = issues.length + "호";
      listEl.innerHTML = issues.map(function(d){
        return '<li><a href="/api/newsletter/issue?d=' + encodeURIComponent(d) + '" target="_blank" rel="noopener noreferrer">' +
               '<span class="d">' + esc(d) + '</span><span class="arw">열람 →</span></a></li>';
      }).join("");
    })
    .catch(function(){
      stateEl.textContent = "발행 내역을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
    });

  // ── 구독 신청 ──
  var emailEl = document.getElementById("subEmail");
  var btn = document.getElementById("subBtn");
  var msg = document.getElementById("subMsg");
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var ERR = {
    invalid_email: "메일 주소 형식을 확인해 주세요.",
    domain_not_allowed: "사내 메일 도메인으로만 신청할 수 있습니다.",
    store_failed: "저장에 실패했습니다. 잠시 후 다시 시도해 주세요."
  };
  function setMsg(text, kind){ msg.textContent = text; msg.className = "sub-msg" + (kind ? " " + kind : ""); }
  function submit(){
    var email = (emailEl.value || "").trim();
    if(!EMAIL_RE.test(email)){ setMsg(ERR.invalid_email, "err"); return; }
    btn.disabled = true; setMsg("신청 중…", "");
    fetch(NL_BASE + "/subscribe", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: email })
    })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { status:r.status, body:j }; }); })
      .then(function(res){
        if(res.body && res.body.ok){
          setMsg("구독 신청이 완료되었습니다. 발행이 시작되면 메일로 보내드립니다.", "ok");
          emailEl.value = "";
        } else {
          var code = res.body && res.body.error;
          setMsg(ERR[code] || "신청에 실패했습니다. 잠시 후 다시 시도해 주세요.", "err");
        }
      })
      .catch(function(){ setMsg("네트워크 오류로 신청하지 못했습니다. 잠시 후 다시 시도해 주세요.", "err"); })
      .then(function(){ btn.disabled = false; });
  }
  btn.addEventListener("click", submit);
  emailEl.addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); });
})();
</script>
</body>
</html>
