<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기획 도구 모음</title>
<style>
  :root{--bg:#fff;--surface:#f6f7f9;--text:#1a1d21;--muted:#5b6470;--border:#e6e9ee;--brand:#1257d6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',system-ui,-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);min-height:100vh;padding:56px 24px}
  .wrap{max-width:860px;margin:0 auto}
  header{margin-bottom:44px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:26px 22px;transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:var(--brand);box-shadow:0 4px 18px rgba(18,87,214,.10)}
  .card h2{font-size:17px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .card h2::after{content:'→';font-size:14px;opacity:.4;margin-left:auto;flex-shrink:0}
  .card p{font-size:13px;color:var(--muted);line-height:1.65}
  .card{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:none}
  .card:active{cursor:grabbing}
  .grid.is-free{display:block;position:relative}
  .grid.is-free .card{position:absolute;margin:0}
  .card.is-dragging{z-index:1000;border-color:var(--brand);box-shadow:0 14px 34px rgba(18,87,214,.22);transform:scale(1.03);cursor:grabbing}
  .updated{margin-top:44px;padding-top:20px;border-top:1px solid var(--border);text-align:left;color:var(--muted);font-size:13px}
  @media (max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>기획 도구 모음</h1>
    <p class="sub">자동화 도구 허브 — 원하는 도구를 선택하세요</p>
  </header>
  <div class="grid">
    <a class="card" href="/agent-guide">
      <h2>클로드로 워드보고서 작성하기</h2>
      <p>Claude AI 에이전트 활용법과 실전 예제를 안내합니다.</p>
    </a>
    <a class="card" href="/report">
      <h2>보고서 자판기</h2>
      <p>지시문을 입력하면 AI가 보고서를 자동으로 작성합니다.</p>
    </a>
    <a class="card" href="/mi">
      <h2>Market Insight</h2>
      <p>시장 동향과 인사이트를 분석·정리합니다.</p>
    </a>
    <a class="card" href="/2030">
      <h2>2030 미래 트렌드</h2>
      <p>2030년 미래 트렌드 전망과 시나리오 분석.</p>
    </a>
  </div>
  <footer class="updated">최종 업데이트: 2026-05-23 22:13</footer>
</div>
<script>
(function(){
  var grid = document.querySelector('.grid');
  if(!grid) return;
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));
  if(!cards.length) return;

  // 위치 저장 키: 화면 크기(데스크톱/모바일)별로 따로 보관
  function bucket(){ return window.matchMedia('(max-width:600px)').matches ? 'm' : 'd'; }
  function posKey(){ return 'portal-card-pos-' + bucket(); }
  function loadPos(){ try{ return JSON.parse(localStorage.getItem(posKey()) || '{}') || {}; }catch(e){ return {}; } }
  function savePos(map){ try{ localStorage.setItem(posKey(), JSON.stringify(map)); }catch(e){} }

  // 기본(그리드) 배치를 측정해 절대 위치로 전환. 저장된 위치가 있으면 그 값을 사용.
  function layout(){
    if(st && st.dragging) return;
    grid.style.height = '';
    grid.classList.remove('is-free');
    cards.forEach(function(c){ c.style.left=''; c.style.top=''; c.style.width=''; c.style.height=''; });
    var base = grid.getBoundingClientRect();
    var rects = cards.map(function(c){
      var r = c.getBoundingClientRect();
      return { left:r.left-base.left, top:r.top-base.top, w:r.width, h:r.height };
    });
    grid.classList.add('is-free');
    var cw = grid.clientWidth, saved = loadPos(), maxBottom = 0;
    cards.forEach(function(c, i){
      var d = rects[i], s = saved[c.getAttribute('href')];
      var left = s ? s.xPct * cw : d.left;
      var top  = s ? s.y : d.top;
      left = Math.max(0, Math.min(left, cw - d.w));
      top = Math.max(0, top);
      c.style.width = d.w + 'px';
      c.style.height = d.h + 'px';
      c.style.left = left + 'px';
      c.style.top = top + 'px';
      maxBottom = Math.max(maxBottom, top + d.h);
    });
    grid.style.height = (maxBottom + 4) + 'px';
  }

  layout();
  window.addEventListener('load', layout);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(layout); }
  var rT; window.addEventListener('resize', function(){ clearTimeout(rT); rT = setTimeout(layout, 150); });

  // 기본 링크 드래그 비활성화
  cards.forEach(function(c){
    c.setAttribute('draggable','false');
    c.addEventListener('dragstart', function(e){ e.preventDefault(); });
  });

  var THRESHOLD = 5, HOLD_MS = 320, HOLD_MOVE = 12; // 모바일: 길게 눌러야 이동 시작
  var st = null, justDragged = false;

  grid.addEventListener('pointerdown', function(e){
    if(e.button !== 0) return;
    var card = e.target.closest && e.target.closest('.card');
    if(!card || card.parentNode !== grid) return;
    var r = card.getBoundingClientRect(), base = grid.getBoundingClientRect();
    var touch = e.pointerType === 'touch';
    st = {
      card:card, touch:touch, armed:!touch, hold:null, dragging:false,
      sx:e.clientX, sy:e.clientY,
      ox:e.clientX - r.left, oy:e.clientY - r.top,
      baseLeft:base.left, baseTop:base.top
    };
    if(touch){
      st.hold = setTimeout(function(){
        if(!st) return;
        st.armed = true; begin();
        if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(_){} }
      }, HOLD_MS);
    }
  });

  function begin(){
    st.dragging = true;
    st.card.classList.add('is-dragging');
    document.body.style.userSelect = 'none';
  }

  window.addEventListener('pointermove', function(e){
    if(!st) return;
    if(!st.dragging){
      if(st.touch && !st.armed){
        // 길게 누르기 전에 움직이면 이동하지 않음(탭으로 처리)
        if(Math.abs(e.clientX-st.sx) > HOLD_MOVE || Math.abs(e.clientY-st.sy) > HOLD_MOVE){
          clearTimeout(st.hold); st = null;
        }
        return;
      }
      if(Math.abs(e.clientX-st.sx) < THRESHOLD && Math.abs(e.clientY-st.sy) < THRESHOLD) return;
      begin();
    }
    var cw = grid.clientWidth, w = st.card.offsetWidth, h = st.card.offsetHeight;
    var left = e.clientX - st.baseLeft - st.ox;
    var top  = e.clientY - st.baseTop  - st.oy;
    left = Math.max(0, Math.min(left, cw - w));
    top = Math.max(0, top);
    st.card.style.left = left + 'px';
    st.card.style.top = top + 'px';
    if(top + h + 4 > grid.clientHeight) grid.style.height = (top + h + 4) + 'px';
  });

  function end(){
    if(!st) return;
    var s = st; st = null;
    if(s.hold) clearTimeout(s.hold);
    if(!s.dragging) return;
    s.card.classList.remove('is-dragging');
    document.body.style.userSelect = '';
    justDragged = true;
    setTimeout(function(){ justDragged = false; }, 60);
    var cw = grid.clientWidth, map = loadPos();
    map[s.card.getAttribute('href')] = {
      xPct: (parseFloat(s.card.style.left) || 0) / cw,
      y: parseFloat(s.card.style.top) || 0
    };
    savePos(map);
    var maxBottom = 0;
    cards.forEach(function(c){ maxBottom = Math.max(maxBottom, c.offsetTop + c.offsetHeight); });
    grid.style.height = (maxBottom + 4) + 'px';
  }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  // 드래그 직후의 클릭(네비게이션) 차단
  grid.addEventListener('click', function(e){
    if(justDragged){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
</body>
</html>
