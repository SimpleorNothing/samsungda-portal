<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기획 도구 모음</title>
<style>
  :root{--bg:#fff;--surface:#f6f7f9;--text:#1a1d21;--muted:#5b6470;--border:#e6e9ee;--brand:#1257d6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',system-ui,-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);min-height:100vh;padding:56px 24px}
  .wrap{max-width:860px;margin:0 auto}
  header{margin-bottom:44px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:26px 22px;transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:var(--brand);box-shadow:0 4px 18px rgba(18,87,214,.10)}
  .card h2{font-size:17px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .card h2::after{content:'→';font-size:14px;opacity:.4;margin-left:auto;flex-shrink:0}
  .card p{font-size:13px;color:var(--muted);line-height:1.65}
  .card{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:none}
  .card:active{cursor:grabbing}
  .card.is-placeholder{opacity:.3;border-style:dashed;box-shadow:none}
  .card.is-clone{cursor:grabbing;background:var(--bg);border-color:var(--brand);box-shadow:0 12px 30px rgba(18,87,214,.20);transform:scale(1.02)}
  .updated{margin-top:44px;padding-top:20px;border-top:1px solid var(--border);text-align:left;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>기획 도구 모음</h1>
    <p class="sub">자동화 도구 허브 — 원하는 도구를 선택하세요</p>
  </header>
  <div class="grid">
    <a class="card" href="/agent-guide">
      <h2>클로드로 워드보고서 작성하기</h2>
      <p>Claude AI 에이전트 활용법과 실전 예제를 안내합니다.</p>
    </a>
    <a class="card" href="/report">
      <h2>보고서 자판기</h2>
      <p>지시문을 입력하면 AI가 보고서를 자동으로 작성합니다.</p>
    </a>
    <a class="card" href="/mi">
      <h2>Market Insight</h2>
      <p>시장 동향과 인사이트를 분석·정리합니다.</p>
    </a>
    <a class="card" href="/2030">
      <h2>2030 미래 트렌드</h2>
      <p>2030년 미래 트렌드 전망과 시나리오 분석.</p>
    </a>
    <a class="card" href="/webauto">
      <h2>웹사이트 자판기</h2>
      <p>지시문을 입력하면 AI가 웹페이지를 자동으로 생성합니다.</p>
    </a>
  </div>
  <footer class="updated">최종 업데이트: 2026-05-23 22:13</footer>
</div>
<script>
(function(){
  var grid = document.querySelector('.grid');
  if(!grid) return;
  var KEY = 'portal-card-order';
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));

  // 저장된 순서 복원
  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || '[]');
    if(Array.isArray(saved)){
      var map = {};
      cards.forEach(function(c){ map[c.getAttribute('href')] = c; });
      saved.forEach(function(id){ if(map[id]) grid.appendChild(map[id]); });
    }
  }catch(e){}

  function saveOrder(){
    var ids = Array.prototype.slice.call(grid.querySelectorAll('.card'))
      .map(function(c){ return c.getAttribute('href'); });
    try{ localStorage.setItem(KEY, JSON.stringify(ids)); }catch(e){}
  }

  // 기본 링크 드래그 비활성화
  cards.forEach(function(c){
    c.setAttribute('draggable','false');
    c.addEventListener('dragstart', function(e){ e.preventDefault(); });
  });

  var THRESHOLD = 5, st = null, justDragged = false;

  grid.addEventListener('pointerdown', function(e){
    if(e.button !== 0) return;
    var card = e.target.closest && e.target.closest('.card');
    if(!card || card.parentNode !== grid) return;
    st = { card:card, sx:e.clientX, sy:e.clientY, dragging:false, gx:0, gy:0, clone:null };
  });

  window.addEventListener('pointermove', function(e){
    if(!st) return;
    if(!st.dragging){
      if(Math.abs(e.clientX-st.sx) < THRESHOLD && Math.abs(e.clientY-st.sy) < THRESHOLD) return;
      begin(e);
    }
    move(e);
  });

  function begin(e){
    var card = st.card, r = card.getBoundingClientRect();
    st.dragging = true;
    st.gx = st.sx - r.left;
    st.gy = st.sy - r.top;
    var clone = card.cloneNode(true);
    clone.className = card.className + ' is-clone';
    clone.style.cssText = 'position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;margin:0;pointer-events:none;z-index:1000';
    document.body.appendChild(clone);
    st.clone = clone;
    card.classList.add('is-placeholder');
    document.body.style.userSelect = 'none';
  }

  function move(e){
    st.clone.style.left = (e.clientX - st.gx) + 'px';
    st.clone.style.top  = (e.clientY - st.gy) + 'px';
    // 포인터 아래 카드 탐지 (클론은 잠시 숨겨서 제외)
    st.clone.style.display = 'none';
    var el = document.elementFromPoint(e.clientX, e.clientY);
    st.clone.style.display = '';
    var over = el && el.closest ? el.closest('.card') : null;
    if(over && over !== st.card && over.parentNode === grid){
      var r = over.getBoundingClientRect();
      if(e.clientX < r.left + r.width/2) grid.insertBefore(st.card, over);
      else grid.insertBefore(st.card, over.nextSibling);
    }
  }

  function end(){
    if(!st) return;
    var s = st; st = null;
    if(!s.dragging) return;
    justDragged = true;
    setTimeout(function(){ justDragged = false; }, 60);
    document.body.style.userSelect = '';
    // 최종 그리드 위치로 스냅 애니메이션 후 정리
    var dest = s.card.getBoundingClientRect(), clone = s.clone, card = s.card;
    clone.style.transition = 'left .16s ease, top .16s ease, transform .16s ease';
    clone.style.left = dest.left + 'px';
    clone.style.top = dest.top + 'px';
    clone.style.transform = 'scale(1)';
    var done = function(){
      if(clone.parentNode) clone.parentNode.removeChild(clone);
      card.classList.remove('is-placeholder');
    };
    clone.addEventListener('transitionend', done, { once:true });
    setTimeout(done, 240);
    saveOrder();
  }
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  // 드래그 직후의 클릭(네비게이션) 차단
  grid.addEventListener('click', function(e){
    if(justDragged){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
</body>
</html>
